name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14", cache: pip}
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - name: Scoring, extraction and read-only tests (no model or data needed)
        run: pytest -q
      - name: Question set is well formed
        run: |
          python - <<'PY'
          import json
          rows = [json.loads(l) for l in open("questions/questions.jsonl")]
          assert len(rows) == 92 and len({r["id"] for r in rows}) == 92
          assert all(r["question"] and r["gold_sql"] for r in rows)
          print(len(rows), "questions")
          PY
